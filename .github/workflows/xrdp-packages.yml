# Builds xrdp and xorgxrdp for Ubuntu 24.04 from Debian's source packages and
# publishes the .deb files as a release, from which server/setup_workstation.sh
# installs them by hash. Ubuntu 24.04 stays on xrdp 0.9.24; 0.10 brings normal
# trackpad scrolling from a Mac and GFX. xorgxrdp is tied to the Xorg it was
# built against, so this runs in a plain Ubuntu 24.04 and nowhere else.
#
# This copy is the source; the workflow runs in NavyCleaner/claude-workstation,
# where the releases live. For a new version: change the names and hashes of
# the two .dsc files below, and the hashes in the server script after the run.
# A .dsc lists the hashes of its source files and dpkg-source checks them, so
# pinning the .dsc pins all of it.
name: xrdp packages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  POOL: https://deb.debian.org/debian/pool/main/x
  XRDP_DSC: xrdp_0.10.6.1-3.dsc
  XRDP_SHA256: 2dec16969c49ad74b79768a6a6dd6691f51ff4326601095855c3efe2ce5e162c
  XORGXRDP_DSC: xorgxrdp_0.10.5-2.dsc
  XORGXRDP_SHA256: 8f8092e577f0905dda6abd36967d0c2e46324dcc5b6e7afbdd9a38b89379d404
  RELEASE: xrdp-0.10.6.1

jobs:
  build:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: ubuntu:24.04
    steps:
      - name: Build
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive
          DEB_BUILD_OPTIONS: nocheck
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl dpkg-dev devscripts equivs

          build() {
              local pkg=$1 dsc=$2 sha=$3 f
              mkdir "$pkg" && cd "$pkg"
              curl -fsSLO "$POOL/$pkg/$dsc"
              echo "$sha  $dsc" | sha256sum -c
              for f in $(awk '/^Files:/{on=1; next} /^[^ ]/{on=0} on{print $3}' "$dsc"); do
                  curl -fsSLO "$POOL/$pkg/$f"
              done
              dpkg-source -x "$dsc" src
              cd src
              mk-build-deps -i -r -t 'apt-get -y --no-install-recommends' debian/control
              dpkg-buildpackage -us -uc -b
              cd ../..
          }

          build xrdp "$XRDP_DSC" "$XRDP_SHA256"
          # xorgxrdp builds against the xrdp it will run with.
          apt-get install -y --no-install-recommends ./xrdp/xrdp_*.deb
          build xorgxrdp "$XORGXRDP_DSC" "$XORGXRDP_SHA256"

          mkdir out
          cp xrdp/xrdp_*.deb xorgxrdp/xorgxrdp_*.deb out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: out/*.deb
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # Never the latest release: the app updates itself from that one.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd out
          sha256sum *.deb | tee SHA256SUMS
          gh release create "$RELEASE" --latest=false --title "$RELEASE" \
              --notes "Built from Debian's $XRDP_DSC and $XORGXRDP_DSC for Ubuntu 24.04." \
              *.deb SHA256SUMS
